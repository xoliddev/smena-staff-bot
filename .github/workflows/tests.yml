name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Dummy values only - tests never reach Telegram or PostgreSQL
      BOT_TOKEN: "123456789:dummy-token-for-ci"
      SUPERADMINS: "111111111"
      RESTAURANT_NAME: "Smena"
      POSTGRES_PASSWORD: "dummy"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
