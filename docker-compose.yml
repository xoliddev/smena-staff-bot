version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smena_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smena_db}
      TZ: Asia/Tashkent
    ports:
      # Exposed on localhost only; the bot reaches the DB over the compose network
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smena_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: smena_bot
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TZ=Asia/Tashkent
      # Force the separate POSTGRES_* settings so a local DATABASE_URL in .env is ignored here
      - DATABASE_URL=
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    volumes:
      - ./logs:/app/logs

volumes:
  pgdata:
